<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101a21" />
    <title>SCAD · Controle de Análise Documental</title>
    <meta
      name="description"
      content="SCAD — um caderno de trabalho para controlar a análise de documentos: importe arquivos, defina critérios, registre verificações e acompanhe apontamentos."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SCAD" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/styles/tokens.css" />
    <link rel="stylesheet" href="/styles/app.css" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>

    <div id="boot" class="boot">
      <div class="boot__panel">
        <span class="boot__mark">SCAD</span>
        <span class="boot__rule" aria-hidden="true"></span>
        <p class="boot__hint">abrindo o arquivo de trabalho…</p>
      </div>
    </div>

    <div id="app" class="app" hidden>
      <header id="masthead" class="masthead"></header>
      <main id="main" class="content" tabindex="-1"></main>
    </div>

    <div id="nav-slot"></div>
    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
    <div id="dialogs"></div>

    <noscript>
      <div class="noscript">O SCAD precisa de JavaScript para funcionar.</div>
    </noscript>

    <script>
      // A tela de carregamento só aparece quando a abertura demora de verdade:
      // em recargas com estado em cache o app pinta antes e nada pisca.
      (function () {
        setTimeout(function () {
          var boot = document.getElementById('boot');
          if (boot && boot.parentNode && !boot.classList.contains('is-hidden')) {
            boot.classList.add('is-visible');
          }
        }, 220);
      })();
    </script>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
